set-option -g history-limit 25000
set -g mouse on

# for neovim
set -sg escape-time 10
set-option -g focus-events on


# vi for copy mode
setw -g mode-keys vi

# status bar
set -g status-right "#(pomo)"
set -g status-style "fg=#d5c4a1,bg=#1d2021"
set -g status-left-style "fg=#1d2021,bg=#83a598"
set -g status-right-style "fg=#1d2021,bg=#8ec07c"
set -g window-status-style "fg=#a89984,bg=#1d2021"
set -g window-status-current-style "fg=#1d2021,bg=#fabd2f,bold"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#8ec07c"

set -g status-bg "#1d2021"
set -g status-position top
set -g status-interval 1
set -g status-left ""

# rename panes to current working directory
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# count the panes from 1
set -g base-index 1
setw -g pane-base-index 1

# term colors, these are the correct ones according to neovim checkhealth
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
